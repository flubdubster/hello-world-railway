<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello Lauti</title>
  <style>
    :root {
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #1f1b3a 0%, #0d0c16 65%);
      color: #f4f4f8;
      padding: 2rem;
    }
    main {
      text-align: center;
      max-width: 480px;
      padding: 3rem 2.5rem;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #c4b5fd;
      background: rgba(139, 92, 246, 0.16);
      border: 1px solid rgba(139, 92, 246, 0.35);
      padding: 0.35rem 0.8rem;
      border-radius: 999px;
      margin-bottom: 1.25rem;
    }
    h1 {
      font-size: clamp(2.25rem, 6vw, 3.25rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.75rem;
    }
    p {
      color: #b4b4c7;
      line-height: 1.6;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <main>
    <span class="badge">Live auf Google Cloud Run</span>
    <h1>Hello Lauti</h1>
    <p>Diese Mini-Website läuft auf Google Cloud Run.</p>
  </main>
</body>
</html>
